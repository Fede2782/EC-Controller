<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root must be allowed to own the service. -->
  <policy user="root">
    <allow own="org.fedelabs.MsiController"/>
    <allow send_destination="org.fedelabs.MsiController"/>
    <allow receive_sender="org.fedelabs.MsiController"/>
  </policy>

  <!-- Service can be called by every user if authenticated.-->
  <policy context="default">
    <allow send_destination="org.fedelabs.MsiController"/>
    <allow receive_sender="org.fedelabs.MsiController"/>
  </policy>

</busconfig>
